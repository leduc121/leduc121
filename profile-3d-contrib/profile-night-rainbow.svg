<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
  <title id="title">3D contribution graph</title>
  <desc id="desc">Placeholder shown until the GitHub Actions workflow generates the contribution graph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04061a" />
      <stop offset="1" stop-color="#0a1232" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a3df0" />
      <stop offset="0.5" stop-color="#5ad1ff" />
      <stop offset="1" stop-color="#7affd9" />
    </linearGradient>
  </defs>
  <rect width="1000" height="180" rx="14" fill="url(#background)" />
  <rect x="1" y="1" width="998" height="178" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="28" cy="24" r="6" fill="#ff5f57" />
  <circle cx="48" cy="24" r="6" fill="#febc2e" />
  <circle cx="68" cy="24" r="6" fill="#28c840" />
  <text x="50%" y="83" fill="url(#accent)" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">3D CONTRIBUTION GRAPH</text>
  <text x="50%" y="116" fill="#8791b8" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">GitHub Actions will refresh this panel automatically.</text>
</svg>
